name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check, verify structure, and build
        run: >-
          bash ./gradlew
          check
          verifyPluginProjectConfiguration
          verifyPluginStructure
          buildPlugin
          --stacktrace

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v7
        with:
          name: motionflow-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/
          if-no-files-found: ignore

  verify:
    name: Plugin Verifier
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # Two extracted IntelliJ baselines exceed the free space left by the
      # general-purpose runner image. These SDKs are unrelated to this job.
      - name: Free disk space for IDE baselines
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run Plugin Verifier
        run: bash ./gradlew verifyPlugin --stacktrace

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore

  platform-tests:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and configuration verification
        if: runner.os != 'Windows'
        run: ./gradlew check verifyPluginProjectConfiguration --stacktrace

      - name: Run tests and configuration verification on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat check verifyPluginProjectConfiguration --stacktrace
