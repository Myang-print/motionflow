<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">MotionFlow logo</title>
  <desc id="description">A mint-to-violet motion curve on a dark rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="24" y1="16" x2="230" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="flow" x1="34" y1="196" x2="222" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43D9AD"/>
      <stop offset="0.52" stop-color="#62C9FF"/>
      <stop offset="1" stop-color="#796FFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#background)"/>
  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M37 163C65 163 72 92 105 92C138 92 140 163 176 163C197 163 214 139 223 116" fill="none" stroke="#38536C" stroke-width="22" stroke-linecap="round" opacity="0.28" filter="url(#glow)"/>
  <path d="M37 163C65 163 72 92 105 92C138 92 140 163 176 163C197 163 214 139 223 116" fill="none" stroke="url(#flow)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="37" cy="163" r="10" fill="#43D9AD"/>
  <circle cx="223" cy="116" r="10" fill="#8B83FF"/>
  <circle cx="223" cy="116" r="22" fill="none" stroke="#8B83FF" stroke-width="3" opacity="0.4"/>
</svg>
